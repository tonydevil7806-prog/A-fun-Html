<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TONY Search Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #ffffff;
        }

        /* Top Navigation Header */
        header {
            display: flex;
            justify-content: flex-end;
            padding: 15px 30px;
            gap: 15px;
        }

        header a {
            text-decoration: none;
            color: #000000;
            font-size: 13px;
            opacity: 0.85;
        }

        header a:hover {
            text-decoration: underline;
        }

        /* Main Search Container */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-bottom: 10%; /* Pushes search up slightly for visual balance */
        }

        /* Custom TONY Branding Logo */
        .logo {
            font-size: 80px;
            font-weight: 700;
            letter-spacing: -2px;
            margin-bottom: 30px;
            user-select: none;
        }

        .logo span:nth-child(1) { color: #4285F4; } /* T - Blue */
        .logo span:nth-child(2) { color: #EA4335; } /* O - Red */
        .logo span:nth-child(3) { color: #FBBC05; } /* N - Yellow */
        .logo span:nth-child(4) { color: #4285F4; } /* Y - Blue */

        /* Search Form and Input Bar */
        .search-form {
            width: 100%;
            max-width: 584px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .search-box-wrapper {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px 14px 45px;
            font-size: 16px;
            border: 1px solid #e4e4e4;
            border-radius: 24px;
            outline: none;
            box-shadow: none;
            transition: box-shadow 0.2s;
        }

        .search-input:hover, .search-input:focus {
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
            border-color: rgba(223,225,229,0);
        }

        /* Custom Magnifying Glass Icon */
        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: #9aa0a6;
            fill: currentColor;
        }

        /* Action Buttons */
        .button-group {
            margin-top: 25px;
            display: flex;
            gap: 12px;
        }

        .btn {
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            font-size: 14px;
            padding: 10px 16px;
            cursor: pointer;
            transition: border 0.1s, box-shadow 0.1s;
        }

        .btn:hover {
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
            background-color: #f8f9fa;
            border: 1px solid #dadce0;
            color: #202124;
        }

        /* Minimalist Footer */
        footer {
            background-color: #f2f2f2;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #e4e4e4;
        }

        footer a {
            text-decoration: none;
            color: #70757a;
            font-size: 14px;
            margin-right: 20px;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <a href="https://google.com">TonyMail</a>
        <a href="https://google.com">Images</a>
    </header>

    <main>
        <!-- TONY Logo stylized like Google's colors -->
        <div class="logo">
            <span>T</span><span>O</span><span>N</span><span>Y</span>
        </div>

        <!-- Google Search integration form -->
        <form class="search-form" action="https://google.com" method="GET">
            <div class="search-box-wrapper">
                <!-- SVG Search Icon -->
                <svg class="search-icon" viewBox="0 0 24 24">
                    <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
                </svg>
                <!-- Target name="q" tells Google to process this input text -->
                <input class="search-input" type="text" name="q" autocomplete="off" autofocus required>
            </div>

            <div class="button-group">
                <button class="btn" type="submit">TONY Search</button>
                <button class="btn" type="button" onclick="alert('You are feeling lucky with TONY!')">I'm Feeling Lucky</button>
            </div>
        </form>
    </main>

    <footer>
        <div>
            <a href="#">About</a>
            <a href="#">Advertising</a>
            <a href="#">Business</a>
        </div>
        <div>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Settings</a>
        </div>
    </footer>

</body>
</html>
